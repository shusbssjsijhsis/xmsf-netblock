# XMSF 定向屏蔽 + 应用断网 - 配置
# 改完执行：su -c 'sh /data/adb/modules/xmsf_netblock/xnb.sh apply'

# 只对这些应用生效（逗号分隔包名；每个应用在各用户下的 UID 都算，例如主用户与应用双开）
PACKAGES=com.xiaomi.xmsf

# 要拦的域名，空格分隔。按明文主机名匹配，不区分大小写，子域名也算在内。
# 默认只拦 hyperos.developer.xiaomi.com：静态分析里它只被 captain（读已安装应用、加密上传）
# 和 game_popup（按包名查游戏预约弹窗）两个模块用，不在推送链路上。
# 不要把推送用的 resolver.msg.xiaomi.net 或泛域名 xiaomi.com 写进来，会断推送。
HOSTS="hyperos.developer.xiaomi.com"

# ---------- 整个断网（v1.3） ----------
# 这些应用的所有连接一律拒绝（逗号分隔包名）：Wi-Fi、流量、VPN、经本机代理都算。各用户
# （主用户、应用双开）下的 UID 都算。DNS 由系统代查，域名还能解析，只是连不上。
# 默认断掉安全守护 com.miui.guardprovider：它的云端查杀会把已装应用的信息发往查杀引擎的云端；
# 断网后本地查杀照常，病毒库不再在线更新。
# 系统共享 UID（appId < 10000）的包会被跳过——那会连系统一起断网；com.xiaomi.xmsf 不接受（会断推送）。
# 不想断就写成 BLOCK_ALL=""
BLOCK_ALL="com.miui.guardprovider"
